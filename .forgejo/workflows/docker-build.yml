# Required repository secrets:
#   REGISTRY_USERNAME - Forgejo username for the container registry
#   REGISTRY_PASSWORD - Forgejo access token with package write permission
name: docker build

on:
  push:
    branches:
      - master

env:
  REGISTRY: git.justprojects.de

jobs:
  build:
    runs-on: docker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${REGISTRY}/${repository}" >> "${GITHUB_ENV}"

      - name: Set InfCloud version
        run: |
          version="$(sed -n 's/^LABEL version="\(.*\)"$/\1/p' Dockerfile)"
          echo "INFCLOUD_VERSION=${version}" >> "${GITHUB_ENV}"

      # See https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # See https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # See https://github.com/docker/login-action
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.INFCLOUD_VERSION }}
